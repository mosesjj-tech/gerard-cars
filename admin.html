<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gerard Cars - Admin Login</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      }

      .logo {
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
      }

      input:focus {
        outline: none;
        border-color: #111;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #111;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #333;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .message {
        margin-top: 20px;
        padding: 12px;
        border-radius: 8px;
        display: none;
        text-align: center;
      }

      .success {
        display: block;
        background: #e8f7ee;
        color: #16753a;
      }

      .error {
        display: block;
        background: #fdecec;
        color: #b42318;
      }

      .back-link {
        display: block;
        text-align: center;
        margin-top: 25px;
        color: #111;
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="logo">🚗 Gerard Cars</div>

      <p class="subtitle">Administrator Login</p>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="username"> Username </label>

          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter admin username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password"> Password </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter admin password"
            required
          />
        </div>

        <button type="submit" id="loginButton">Login</button>
      </form>

      <div id="loginMessage" class="message"></div>

      <a href="index.html" class="back-link"> ← Back to Gerard Cars </a>
    </div>

    <script>
      const API_URL = "http://localhost:3000";

      const loginForm = document.getElementById("adminLoginForm");

      const loginButton = document.getElementById("loginButton");

      const loginMessage = document.getElementById("loginMessage");

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();

        const password = document.getElementById("password").value;

        loginMessage.className = "message";
        loginMessage.textContent = "";

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {
          const response = await fetch(`${API_URL}/api/admin/login`, {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              username: username,
              password: password,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Login failed.");
          }

          // Save JWT token locally
          localStorage.setItem("gerardAdminToken", data.token);

          loginMessage.className = "message success";

          loginMessage.textContent = "Admin login successful!";

          setTimeout(() => {
            window.location.href = "admin-dashboard.html";
          }, 1000);
        } catch (error) {
          console.error("Admin login error:", error);

          loginMessage.className = "message error";

          loginMessage.textContent =
            error.message || "Unable to connect to the server.";
        } finally {
          loginButton.disabled = false;

          loginButton.textContent = "Login";
        }
      });
    </script>
  </body>
</html>
